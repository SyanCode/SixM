<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SixM</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="/favicon.svg" alt="" width="28" height="28"><span>SixM</span></div>
    <nav aria-label="Menu">
      <button type="button" data-view="play">Jouer</button>
      <button type="button" data-view="host">Héberger<span class="dot" id="nav-host" hidden></span></button>
      <button type="button" data-view="settings">Réglages</button>
    </nav>
    <div class="side-foot"><strong id="foot-name"></strong><span id="foot-mode"></span></div>
  </aside>
  <main id="main"></main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
