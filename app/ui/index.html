<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SixM</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="/favicon.svg" alt="" width="34" height="34"><span>SixM</span></div>
    <nav aria-label="Menu">
      <button type="button" data-view="play">Jouer</button>
      <button type="button" data-view="host">Héberger<span class="dot on" id="nav-host" hidden></span></button>
      <button type="button" data-view="settings">Réglages</button>
    </nav>
    <button type="button" class="me" id="me" aria-label="Modifier mon profil"></button>
  </header>
  <main id="main"></main>
  <footer id="dock" hidden></footer>
  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
